# Prototype testbed: Mac, minikube profile vpa-serverless (vfkit VM, 4 vCPU, 8 GB). Spec section 2.
context = "vpa-serverless"
namespace = "vpaexp"
image = "vpaexp-function:1"

# NodePort on the VM. Check the address with: minikube -p vpa-serverless ip
function_url = "http://192.168.64.8:30080/"

# The prototype API server writes its audit log to stdout (scripts/setup-prototype.sh).
audit_log_cmd = ["kubectl", "--context", "vpa-serverless", "-n", "kube-system", "logs", "kube-apiserver-vpa-serverless", "--since=3h"]

# Limits for sizing replays (no VPA), and the cap on the prototype's initial allocation.
# System pods on the 4-vCPU VM already request about 1.2 CPU, so 2.5 is what fits.
generous_cpu_millicores = 2500
generous_memory_mib = 4096

# maxAllowed = node allocatable minus this reserve. [verify value]
system_reserve_cpu_millicores = 1500
system_reserve_memory_mib = 2048

# Payload cost, measured once on the Mac outside a container [verify].
# `vpaexp measure` replaces these with values measured in the container.
service_s = 0.33
request_mem_mib = 115
baseline_mem_mib = 33
