# Full-run testbed: ARM Linux server, 128 cores (2 NUMA nodes x 64), kubeadm single node. Spec section 2.
context = "kubernetes-admin@kubernetes"
namespace = "vpaexp"
image = "vpaexp-function:1"

function_url = "http://127.0.0.1:30080/"

audit_log_cmd = ["sudo", "cat", "/var/log/kubernetes/audit/audit.log"]

# The load generator and collectors pin themselves to this NUMA node; pods run on node 0.
client_numa_node = 1

# Limits for sizing replays (no VPA).
generous_cpu_millicores = 32000
generous_memory_mib = 65536

# maxAllowed = node allocatable minus this reserve. [verify value] (spec section 13)
system_reserve_cpu_millicores = 4000
system_reserve_memory_mib = 16384

# Payload cost: Mac estimates [verify]. Run `vpaexp --profile full measure` first; it overrides these.
service_s = 0.33
request_mem_mib = 115
baseline_mem_mib = 33
